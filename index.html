*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}

.link{background:none;border:0;color:var(--acc);padding:0}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

.seg{display:flex;gap:8px;margin:20px 0 4px}.seg button{flex:1;background:none;border:0;border-bottom:2px solid var(--line);padding:10px;color:var(--mute)}

header .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{font-weight:700;font-size:20px;margin-right:auto}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:600}
.tab.on{background:var(--card);color:var(--ink)}
.who{font-size:14px;color:var(--mute);margin-left:8px}
main{padding:20px 16px 60px}
.total{font-size:56px;font-weight:700;line-height:1.1}
.stats{display:flex;gap:10px;margin:14px 0 8px}.stats div{flex:1;background:var(--card);border-radius:10px;padding:10px 12px}.stats b{display:block;font-size:20px}
.sub{display:flex;gap:18px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.sub button{background:none;border:0;padding:6px 0;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.sub button.on{color:var(--ink);border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.day{display:flex;align-items:center;gap:10px}
.step{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:none;font-size:22px;line-height:1}
.step:disabled{opacity:.3;cursor:default}.day .step{width:36px;height:36px;font-size:18px}
.counter{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
.ctl{display:flex;gap:8px}.ctl input{width:84px;text-align:center;font-size:22px;font-weight:700;padding:8px;-moz-appearance:textfield}
.ctl input::-webkit-inner-spin-button,.ctl input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .g{flex:1;min-width:0}.row .p{font-weight:700;font-size:18px}.row .a{display:flex;gap:10px;font-size:14px}
button.row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
button.row:hover{background:var(--card)}.row.me{background:var(--me)}.rk{width:28px;color:var(--mute)}
.empty{background:var(--card);border-radius:10px;padding:22px;text-align:center;margin-top:10px}
.notify{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;margin:8px 0 14px;border-bottom:1px solid var(--line)}
.notify .small{flex:1}
#wr{min-height:55vh;font:17px/1.6 Georgia,serif;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#E6ECE9;color:#12181A;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{white-space:pre-wrap;font:17px/1.6 Georgia,serif;background:var(--card);border-radius:10px;padding:14px}
h2{font-size:17px;margin:26px 0 8px}.leg{display:flex;gap:16px;font-size:14px;color:var(--mute);margin:4px 0 14px}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:20px;width:400px;max-width:calc(100% - 24px)}

dialog{position:fixed;bottom:0;margin:0;max-width:100%;width:100%;border-radius:16px 16px 0 0}}

<script>
const $=s=>document.querySelector(s),J=JSON.stringify;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=m=>/@/.test(m||'')?'That username couldn’t be accepted. Try another.':String(m||'').replace(/e-?mail/gi,'username');
const n2=x=>String(+(+x).toFixed(2)),iv=s=>Math.max(0,Math.min(100000,Math.floor(+s||0)));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const fmt=(d,o)=>new Date(d+'T00:00:00Z').toLocaleDateString('en',{...o,timeZone:'UTC'});
const fmtDay=d=>fmt(d,{weekday:'short',day:'numeric',month:'short'}),wd=d=>fmt(d,{weekday:'short'});
let S=null;try{S=JSON.parse(localStorage.getItem('ledger.s')||'null')}catch(e){}
const fresh=()=>({state:'loading',me:null,board:[],days:{},exams:[],writing:'',day:today(),lb:'today',err:''});
let D=fresh(),P=null,R='me-today',mode='in',editId=null,dirtyW=false,saveWT=null,pend=null,saveDT=null;
const keep=s=>{S=s;try{s?localStorage.setItem('ledger.s',J(s)):localStorage.removeItem('ledger.s')}catch(e){}};
async function raw(path,opt={},tk){
  const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Authorization:'Bearer '+(tk||SUPABASE_KEY),...(opt.headers||{})}});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
  if(!r.ok){const e=new Error(clean(j&&(j.msg||j.message||j.error_description||j.error)||'Request failed ('+r.status+')'));e.status=r.status;e.body=j;throw e}return j}
const setSess=j=>keep({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()/1000+(j.expires_in||3600),uid:j.user.id});
async function tok(){if(!S)throw new Error('Signed out');if(S.expires_at-60<Date.now()/1000)setSess(await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:J({refresh_token:S.refresh_token})}));return S.access_token}
const api=async(p,o)=>raw('/rest/v1/'+p,o,await tok());
const min={Prefer:'return=minimal'},patch=b=>({method:'PATCH',headers:min,body:J(b)});
async function pushConfig(){
  const r=await fetch(SUPABASE_URL+'/functions/v1/ledger-push-score-change',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await tok()}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Push notifications are not configured yet.');return j.vapidPublicKey}
function vapidBytes(k){const p=k+'='.repeat((4-k.length%4)%4),b=p.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
async function ensurePushSubscription(requestPermission=false){
  if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('Push notifications are not supported in this browser.');
  const key=await pushConfig();if(!key)throw new Error('Push notifications are not configured yet.');
  let permission=Notification.permission;
  if(permission==='default'&&requestPermission)permission=await Notification.requestPermission();
  if(permission!=='granted')throw new Error(permission==='denied'?'Notifications are blocked in browser settings.':'Turn on notification access first.');
  const reg=await navigator.serviceWorker.register('/sw.js');
  const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(key)});
  await api('push_subscriptions?on_conflict=user_id,endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:J({endpoint:sub.endpoint,subscription:sub.toJSON()})});
  return sub}
async function enablePushForProfile(){
  try{await ensurePushSubscription(true);render();toast('Notifications are on. Choose Notify me for this person.')}catch(e){render();toast(e.message)}}
async function toggleProfileNotification(){
  if(!P||!P.notificationsReady)return;
  try{
    if(P.notifyEnabled){await api('notification_follows?subscriber_id=eq.'+S.uid+'&followed_user_id=eq.'+P.id,{method:'DELETE',headers:min});P.notifyEnabled=false;toast('Notifications turned off for '+P.username)}
    else{await ensurePushSubscription(false);await api('notification_follows?on_conflict=subscriber_id,followed_user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:J({followed_user_id:P.id})});P.notifyEnabled=true;toast('You’ll be notified when '+P.username+' reaches #1')}
    render()
  }catch(e){toast(e.message)}}
async function notifyScoreChange(day){
  try{const r=await fetch(SUPABASE_URL+'/functions/v1/ledger-push-score-change',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+await tok(),'Content-Type':'application/json'},body:J({day})});
    if(!r.ok){const j=await r.json().catch(()=>({}));console.warn('Push check failed:',j.error||r.status)}}
  catch(e){console.warn('Push check failed:',e.message)}}
const toMap=rows=>{const m={};(rows||[]).forEach(r=>m[r.day]={mcq:r.mcq,cq:r.cq});return m};
const scores=()=>api('rpc/ledger_scores',{method:'POST',body:J({d:today()})});
/* points: MCQ 1, CQ 2.5; an exam counts only its own exam points (its MCQ/CQ marks are just a record) */
function dayStats(days,exams,d){const v=days[d]||{mcq:0,cq:0};let mcq=v.mcq,cq=v.cq,ex=0;
  exams.forEach(e=>{if(e.day===d)ex+=+e.value});return{mcq,cq,ex,points:mcq+cq*2.5+ex}}
function overall(days,exams){const ds=new Set([...Object.keys(days),...exams.map(e=>e.day)]);const t={mcq:0,cq:0,ex:0,points:0};
  ds.forEach(d=>{const s=dayStats(days,exams,d);t.mcq+=s.mcq;t.cq+=s.cq;t.ex+=s.ex;t.points+=s.points});return t}
function ranked(kind){const a=kind==='today';
  const b=D.board.map(r=>({id:r.id,username:r.username,mcq:+r[a?'d_mcq':'t_mcq'],cq:+r[a?'d_cq':'t_cq'],ex:+r[a?'d_exam':'t_exam'],points:+r[a?'d_points':'t_points']}));
  b.sort((x,y)=>y.points-x.points||x.username.localeCompare(y.username));b.forEach(r=>r.rank=1+b.filter(z=>z.points>r.points).length);return b}
const rankOf=(id,k)=>{const r=ranked(k).find(x=>x.id===id);return r?r.rank:'–'};
async function refresh(silent){
  if(!silent){D.state='loading';render()}
  try{const [pr,b,dy,ex]=await Promise.all([api('profiles?select=id,username,writing&id=eq.'+S.uid),scores(),
    api('ledger_days?select=day,mcq,cq&user_id=eq.'+S.uid+'&limit=3000'),api('ledger_exams?select=*&user_id=eq.'+S.uid+'&order=day.desc,created_at.desc&limit=1000')]);
    if(!pr.length)throw new Error('Your profile is missing. Sign out and sign in again.');
    D.me=pr[0];if(!silent)D.writing=pr[0].writing||'';D.board=b||[];D.days=toMap(dy);D.exams=ex||[];D.state='ready'}
  catch(e){D.state='error';D.err=e.message}
  render()}
async function loadBoard(){try{D.board=await scores();if(R==='board')render();else updateNums()}catch(e){}}
async function loadProfile(id){
  P={id,state:'loading'};render();
  try{const [pr,dy,ex]=await Promise.all([api('profiles?select=id,username,writing&id=eq.'+id),api('ledger_days?select=day,mcq,cq&user_id=eq.'+id+'&limit=3000'),api('ledger_exams?select=*&user_id=eq.'+id+'&order=day.desc&limit=1000')]);
    if(!pr.length)throw new Error('That person was not found.');
    let notificationsReady=false,notifyEnabled=false;
    if(id!==S.uid){try{const follows=await api('notification_follows?select=followed_user_id&subscriber_id=eq.'+S.uid+'&followed_user_id=eq.'+id);notificationsReady=true;notifyEnabled=follows.length>0}catch(e){console.warn('Notification settings are not set up in Supabase yet.',e.message)}}
    P={id,state:'ready',username:pr[0].username,writing:pr[0].writing||'',days:toMap(dy),exams:ex||[],notificationsReady,notifyEnabled}}
  catch(e){P={id,state:'error',err:e.message}}
  render()}
const wait=(st,err)=>st==='loading'?'<div class="empty mute">Loading…</div>':`<div class="empty"><p>Something went wrong: ${esc(err)}</p><button class="btn" data-act="retry">Try again</button></div>`;
const statRow=t=>`<div class="stats"><div class="mute">MCQs<b>${t.mcq}</b></div><div class="mute">CQs<b>${t.cq}</b></div><div class="mute">Exam points<b>${n2(t.ex)}</b></div></div>`;
function chart(days,exams){
  const ds=[];for(let i=6;i>=0;i--)ds.push(addDays(today(),-i));
  const st=ds.map(d=>dayStats(days,exams,d)),mx=Math.max(10,...st.map(s=>s.points));
  const W=340,H=170,pb=22,pt=18,bw=28,gap=(W-7*bw)/8;let g=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="#2C393C"/>`;
  st.forEach((s,i)=>{const x=gap+i*(bw+gap);let y=H-pb;
    [[s.mcq,'#3FB7AE'],[s.cq*2.5,'#E0B84A'],[s.ex,'#E07A5F']].forEach(([v,c])=>{const h=v/mx*(H-pb-pt);if(h>0){y-=h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${c}"/>`}});
    g+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" fill="#E6ECE9" font-size="11">${s.points?n2(s.points):''}</text><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" fill="#8FA1A3" font-size="11">${wd(ds[i])}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points per day, last 7 days" style="width:100%;height:auto">${g}</svg><div class="leg"><span><b style="color:#3FB7AE">■</b> MCQ</span><span><b style="color:#E0B84A">■</b> CQ</span><span><b style="color:#E07A5F">■</b> Exam</span></div>`}
function dayRows(list,days,exams,click){
  if(!list.length)return'<div class="empty mute">Nothing logged yet.</div>';
  return list.map(d=>{const s=dayStats(days,exams,d),T=click?'button':'div';
    return`<${T} class="row"${click?` data-act="pick" data-d="${d}"`:''}><span class="g"><b>${fmtDay(d)}</b><div class="mute small">MCQ ${s.mcq} &nbsp;CQ ${s.cq} &nbsp;Exams ${n2(s.ex)}</div></span><span class="p">${n2(s.points)}</span></${T}>`}).join('')}
const last7=()=>[0,1,2,3,4,5,6].map(i=>addDays(today(),-i));
const stepper=(k,label,hint,v)=>`<div class="counter"><div><b>${label}</b><div class="mute small">${hint} &nbsp;<span id="h-${k}"></span></div></div><div class="ctl"><button class="step" data-act="step" data-k="${k}" data-n="-1" aria-label="One fewer">−</button><input id="in-${k}" type="number" inputmode="numeric" min="0" step="1" value="${v}" aria-label="${label}"><button class="step" data-act="step" data-k="${k}" data-n="1" aria-label="One more">+</button></div></div>`;
function todayView(){
  const d=D.day,v=D.days[d]||{mcq:0,cq:0},isT=d===today(),xs=D.exams.filter(e=>e.day===d);
  return`<div class="bar"><div class="day"><button class="step" data-act="day" data-n="-1" aria-label="Previous day">‹</button><b>${isT?'Today':fmtDay(d)}</b><button class="step" data-act="day" data-n="1" ${isT?'disabled':''} aria-label="Next day">›</button></div><span style="display:flex;gap:10px;align-items:center"><span class="mute small" id="rk"></span><button class="btn ghost" data-act="share" data-id="${D.me.id}">Share picture</button></span></div>
   <div class="total" id="dp">0</div><div class="mute">points ${isT?'today':'this day'} &nbsp;overall <b id="ot"></b></div>
   ${stepper('mcq','MCQs solved','1 point each',v.mcq)}${stepper('cq','CQs written','2.5 points each',v.cq)}
   <div class="mute small" id="ds">Saves as you type</div>
   <div class="bar" style="margin-top:22px"><h2 style="margin:0">Exams</h2><button class="btn" data-act="addx">Add exam</button></div>
   ${xs.length?xs.map(e=>`<div class="row"><div class="g"><b>${esc(e.label||'Exam')}</b><div class="mute small">${n2(e.value)} exam points${e.mcq_got!=null?' &nbsp;MCQ '+mk(e.mcq_got,e.mcq_of):''}${e.cq_got!=null?' &nbsp;CQ '+mk(e.cq_got,e.cq_of):''}</div></div><div class="p">+${n2(e.value)}</div><div class="a"><button class="link" data-act="editx" data-id="${e.id}">Edit</button><button class="link" data-act="delx" data-id="${e.id}">Delete</button></div></div>`).join(''):'<p class="mute small">No exams on this day.</p>'}`}
function meView(sec){

let tT=null;const toast=m=>{const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,4000)};
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
async function scoreCard(name,id,days,exams){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F=(w,z)=>w+' '+z+'px system-ui,-apple-system,"Segoe UI",Arial,sans-serif',T=(t,a,b,f,col,al)=>{x.font=f;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,a,b)};

  const td=dayStats(days,exams,today()),t=overall(days,exams);

  T(fmt(today(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}),64,385,F(400,34),'#8FA1A3');
  T('TODAY',64,500,F(600,30),'#8FA1A3');
  T(n2(td.points),64,690,F(700,200),'#E6ECE9');
  T('points',64,750,F(400,40),'#8FA1A3');T('Rank #'+rankOf(id,'today')+' today',1016,750,F(600,40),'#3FB7AE','right');
  [['MCQ',td.mcq],['CQ',td.cq],['Exam points',n2(td.ex)]].forEach(([l,v],i)=>{const a=64+i*326;x.fillStyle='#1A2326';rr(x,a,810,300,150,18);x.fill();T(String(v),a+24,885,F(700,64),'#E6ECE9');T(l,a+24,935,F(400,28),'#8FA1A3')});
  T('OVERALL',64,1040,F(600,30),'#8FA1A3');T(n2(t.points)+' points',64,1100,F(700,60),'#E6ECE9');T('Rank #'+rankOf(id,'all'),1016,1100,F(600,40),'#3FB7AE','right');
  const ds=[];for(let i=6;i>=0;i--)ds.push(addDays(today(),-i));
  const st=ds.map(d=>dayStats(days,exams,d)),mx=Math.max(10,...st.map(q=>q.points)),bw=96,gap=(952-7*bw)/6,base=1290;
  st.forEach((q,i)=>{const a=64+i*(bw+gap);let y=base;[[q.mcq,'#3FB7AE'],[q.cq*2.5,'#E0B84A'],[q.ex,'#E07A5F']].forEach(([v,col])=>{const h=v/mx*120;if(h>0){y-=h;x.fillStyle=col;x.fillRect(a,y,bw,h)}});
    x.fillStyle='#2C393C';x.fillRect(a,base,bw,3);T(wd(ds[i]),a+bw/2,base+34,F(400,24),'#8FA1A3','center')});
  return new Promise(r=>c.toBlob(r,'image/png'))}
async function share(id){
  const mine=D.me&&id===D.me.id,src=mine?{username:D.me.username,days:D.days,exams:D.exams}:P;if(!src||!src.days)return;
  toast('Making your picture…');
  try{const blob=await scoreCard(src.username,id,src.days,src.exams),name='ledger-'+src.username+'.png',file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){

function route(){const h=location.hash.slice(1);R=/^(me-(today|history|writing)|board|u-[0-9a-f-]{36})$/.test(h)?h:'me-today';
  if(S&&R.startsWith('u-')){const id=R.slice(2);if(D.me&&id===D.me.id)R='me-today';else if(!P||P.id!==id||P.state==='error'){loadProfile(id);return}}

async function authGo(){
  const u=$('#au').value.trim(),p=$('#ap').value,E=$('#ae'),B=$('#ab');E.textContent='';
  if(!/^[A-Za-z0-9_.-]{3,20}$/.test(u)){E.textContent='Usernames are 3–20 characters: letters, numbers, dots, dashes, underscores.';return}
  if(p.length<6){E.textContent='Passwords need at least 6 characters.';return}
  B.disabled=true;const em=u.toLowerCase()+'@'+LOGIN_DOMAIN,taken=()=>Object.assign(new Error('taken'),{taken:1});
  try{
    if(mode==='up'){let j;
      try{j=await raw('/auth/v1/signup',{method:'POST',body:J({email:em,password:p})})}
      catch(e){if(e.body&&(e.body.error_code==='user_already_exists'||/already/i.test(e.message)))throw taken();throw e}
      if(!j.access_token)throw new Error('Sign-up still needs a confirmation step. Turn it off in the Supabase Auth settings.');

  B.disabled=false}
